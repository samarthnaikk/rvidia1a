events {}

http {
  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend:8000/;
    }

    location /auth/ {
      proxy_pass http://backend:8000;
    }

    location /jobs/ {
      proxy_pass http://backend:8000;
    }

    location /p2p/ {
      proxy_pass http://backend:8000;
    }

    location / {
      proxy_pass http://frontend:3000;
    }
  }
}
